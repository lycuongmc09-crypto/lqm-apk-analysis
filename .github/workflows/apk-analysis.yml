name: apk-analysis
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Download APK from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p in
          gh release download apk -R "${{ github.repository }}" -p '*.apk' -D in
          ls -lh in
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-jdk-headless unzip zip >/dev/null
          curl -sSL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q jadx.zip -d jadx
          curl -sSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          java -jar apktool.jar --version
      - name: jadx decompile (dex only)
        run: |
          ./jadx/bin/jadx --no-res --threads-count 4 -d out in/*.apk || true
          find out/sources -name '*.java' | wc -l
      - name: apktool decode resources
        run: |
          java -Xmx4g -jar apktool.jar d -f -s -o apktool_out in/*.apk || true
      - name: Package artifacts
        run: |
          mkdir -p artifact/sources artifact/res
          for p in com/ano com/garena com/tencent/gcloud com/tencent/tme com/ihoc com/intlgame com/centauri; do
            if [ -d "out/sources/$p" ]; then mkdir -p "artifact/sources/$(dirname $p)"; cp -r "out/sources/$p" "artifact/sources/$p"; fi
          done
          [ -f apktool_out/AndroidManifest.xml ] && cp apktool_out/AndroidManifest.xml artifact/
          [ -d apktool_out/res ] && cp -r apktool_out/res artifact/res/
          find out/sources -name '*.java' > artifact/all_classes.txt || true
          grep -rilE 'ysmteam|gshell|AnoApplication|loadLibrary' out/sources > artifact/interesting_hits.txt || true
          du -sh artifact || true
          cd artifact && zip -qr ../artifact.zip . && cd ..
          ls -lh artifact.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lqm-jadx-selected
          path: artifact.zip
          compression-level: 6
