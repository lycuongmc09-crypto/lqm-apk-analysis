name: apk-analysis
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Download APK from private host
        env:
          GH_TOKEN: ${{ secrets.APK_HOST_TOKEN }}
        run: |
          mkdir -p in
          gh release download apk -R lycuongmc09-crypto/lqm-apk-host -p '*.apk' -D in
          ls -lh in
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-jdk-headless unzip zip p7zip-full >/dev/null
          curl -sSL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q jadx.zip -d jadx
          curl -sSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
      - name: jadx decompile (dex only)
        run: |
          ./jadx/bin/jadx --no-res --threads-count 4 -d out in/*.apk || true
          find out/sources -name '*.java' | wc -l
      - name: apktool decode resources
        run: |
          java -Xmx4g -jar apktool.jar d -f -s -o apktool_out in/*.apk || true
      - name: Unpack 7z payloads and verify
        run: |
          mkdir -p x
          cd x
          7z x ../in/*.apk 'lib/arm64-v8a/libResources.so' 'assets/game_resources.png' 'assets/res.data' -y >/dev/null
          7z x lib/arm64-v8a/libResources.so -olibres -y >/dev/null
          7z l assets/game_resources.png > game_resources_list.txt || true
          python3 - <<'PY'
          import hashlib, json, os
          rep=[]
          exp={e['path'].lstrip('/'):e['md5'] for e in json.load(open('assets/res.data'))['arm64-v8a']}
          for root,_,files in os.walk('libres'):
              for f in files:
                  fp=os.path.join(root,f)
                  rel=os.path.relpath(fp,'libres').replace('\\','/')
                  h=hashlib.md5(open(fp,'rb').read()).hexdigest()
                  e=exp.get(rel)
                  rep.append(f"{rel}\t{os.path.getsize(fp)}\t{h}\t{'MATCH' if e==h else ('DIFF exp='+str(e) if e else 'not-in-res.data')}")
          open('../libres_verify.txt','w').write('\n'.join(rep))
          print('\n'.join(rep))
          PY
          cd ..
      - name: Package artifacts
        run: |
          mkdir -p artifact/sources artifact/res
          for p in com/ano com/garena com/tencent/gcloud com/tencent/tme com/ihoc com/intlgame com/centauri; do
            if [ -d "out/sources/$p" ]; then mkdir -p "artifact/sources/$(dirname $p)"; cp -r "out/sources/$p" "artifact/sources/$p"; fi
          done
          [ -f apktool_out/AndroidManifest.xml ] && cp apktool_out/AndroidManifest.xml artifact/
          [ -d apktool_out/res ] && cp -r apktool_out/res artifact/res/
          find out/sources -name '*.java' > artifact/all_classes.txt || true
          grep -rilE 'ysmteam|gshell|AnoApplication|loadLibrary|System\.load' out/sources > artifact/interesting_hits.txt || true
          cp libres_verify.txt artifact/ 2>/dev/null || true
          cp x/game_resources_list.txt artifact/ 2>/dev/null || true
          du -sh artifact || true
          cd artifact && zip -qr ../artifact.zip . && cd ..
          ls -lh artifact.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lqm-jadx-selected
          path: artifact.zip
          compression-level: 6
